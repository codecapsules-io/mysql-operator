name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CI: true
  CI_BUILD_NUMBER: ${{ github.run_id }}
  E2E_IMAGE_REGISTRY: mysql-operator-ci
  E2E_IMAGE_TAG: local

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mysql-operator

      - name: Build and tag images for kind
        env:
          BUILD_ARGS: --load
          IMAGE_TAG: ${{ env.E2E_IMAGE_TAG }}
          DOCKER_REGISTRY: ${{ env.E2E_IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          make -j4 build
          # Retag build/<hash>/…-amd64 → mysql-operator-ci/…:local (see build/makelib/image.mk)
          make .img.release.build
          for img in mysql-operator mysql-operator-orchestrator mysql-operator-sidecar-5.7 mysql-operator-sidecar-8.0 mysql-operator-sidecar-8.4; do
            built="${E2E_IMAGE_REGISTRY}/${img}:${E2E_IMAGE_TAG}-amd64"
            ref="${E2E_IMAGE_REGISTRY}/${img}:${E2E_IMAGE_TAG}"
            docker tag "${built}" "${ref}"
            # Kind matches images by exact reference; use short local names in pods.
            docker tag "${ref}" "${img}:${E2E_IMAGE_TAG}"
          done

      - name: Load images into kind
        env:
          CLUSTER_NAME: mysql-operator
        run: |
          set -euo pipefail
          for img in mysql-operator mysql-operator-orchestrator mysql-operator-sidecar-5.7 mysql-operator-sidecar-8.0 mysql-operator-sidecar-8.4; do
            kind load docker-image --name "${CLUSTER_NAME}" "${img}:${E2E_IMAGE_TAG}"
          done
          # Default MySQL 5.7.35 server image and metrics exporter used by cluster pods.
          PERCONA_IMAGE="percona@sha256:caab4e854bd75040d07802bf1862bfef1d2b4db0acbc9c4aaf5c21c698fdd393"
          EXPORTER_IMAGE="prom/mysqld-exporter:v0.16.0"
          docker pull "${PERCONA_IMAGE}"
          docker pull "${EXPORTER_IMAGE}"
          kind load docker-image --name "${CLUSTER_NAME}" "${PERCONA_IMAGE}"
          kind load docker-image --name "${CLUSTER_NAME}" "${EXPORTER_IMAGE}"
          docker exec "${CLUSTER_NAME}-control-plane" crictl images

      - name: Run e2e tests
        env:
          ACK_GINKGO_DEPRECATIONS: "1.16.4"
        run: |
          make e2e GO_INTEGRATION_TESTS_PARAMS="-timeout 75m \
            -ginkgo.slowSpecThreshold 600 \
            -ginkgo.skip='Mysql backups' \
            -- \
            --pod-wait-timeout 600 \
            --kubernetes-config $HOME/.kube/config \
            --operator-image mysql-operator:${E2E_IMAGE_TAG} \
            --sidecar-mysql57-image mysql-operator-sidecar-5.7:${E2E_IMAGE_TAG} \
            --sidecar-mysql8-image mysql-operator-sidecar-8.0:${E2E_IMAGE_TAG} \
            --sidecar-mysql84-image mysql-operator-sidecar-8.4:${E2E_IMAGE_TAG} \
            --orchestrator-image mysql-operator-orchestrator:${E2E_IMAGE_TAG}"
