name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CI: true
  CI_BUILD_NUMBER: ${{ github.run_id }}
  E2E_IMAGE_REGISTRY: mysql-operator-ci
  E2E_IMAGE_TAG: local
  KIND_E2E_REGISTRY: kind-e2e
  CLUSTER_NAME: mysql-operator

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mysql-operator

      - name: Run e2e tests
        run: bash hack/e2e-kind.sh --skip-cluster
