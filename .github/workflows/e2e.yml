name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CI: true
  CI_BUILD_NUMBER: ${{ github.run_id }}
  E2E_IMAGE_REGISTRY: mysql-operator-ci
  E2E_IMAGE_TAG: local

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mysql-operator

      - name: Build and tag images for kind
        env:
          BUILD_ARGS: --load
          IMAGE_TAG: ${{ env.E2E_IMAGE_TAG }}
          DOCKER_REGISTRY: ${{ env.E2E_IMAGE_REGISTRY }}
        run: |
          make -j4 build
          # Retag build/<hash>/…-amd64 → mysql-operator-ci/…:local (see build/makelib/image.mk)
          make .img.release.build
          for img in mysql-operator mysql-operator-orchestrator mysql-operator-sidecar-5.7 mysql-operator-sidecar-8.0 mysql-operator-sidecar-8.4; do
            docker tag "${E2E_IMAGE_REGISTRY}/${img}:${E2E_IMAGE_TAG}-amd64" "${E2E_IMAGE_REGISTRY}/${img}:${E2E_IMAGE_TAG}"
          done

      - name: Load images into kind
        env:
          CLUSTER_NAME: mysql-operator
        run: |
          set -euo pipefail
          for img in mysql-operator mysql-operator-orchestrator mysql-operator-sidecar-5.7 mysql-operator-sidecar-8.0 mysql-operator-sidecar-8.4; do
            ref="${E2E_IMAGE_REGISTRY}/${img}:${E2E_IMAGE_TAG}"
            docker tag "$ref" "docker.io/${ref}"
            kind load docker-image --name "${CLUSTER_NAME}" "$ref"
            kind load docker-image --name "${CLUSTER_NAME}" "docker.io/${ref}"
          done

      - name: Run e2e tests
        env:
          ACK_GINKGO_DEPRECATIONS: "1.16.4"
        run: |
          make e2e GO_INTEGRATION_TESTS_PARAMS="-timeout 50m \
            -ginkgo.slowSpecThreshold 300 \
            -ginkgo.skip='Mysql backups' \
            -- \
            --pod-wait-timeout 200 \
            --kubernetes-config $HOME/.kube/config \
            --operator-image ${E2E_IMAGE_REGISTRY}/mysql-operator:${E2E_IMAGE_TAG} \
            --sidecar-mysql57-image ${E2E_IMAGE_REGISTRY}/mysql-operator-sidecar-5.7:${E2E_IMAGE_TAG} \
            --sidecar-mysql8-image ${E2E_IMAGE_REGISTRY}/mysql-operator-sidecar-8.0:${E2E_IMAGE_TAG} \
            --sidecar-mysql84-image ${E2E_IMAGE_REGISTRY}/mysql-operator-sidecar-8.4:${E2E_IMAGE_TAG} \
            --orchestrator-image ${E2E_IMAGE_REGISTRY}/mysql-operator-orchestrator:${E2E_IMAGE_TAG}"
