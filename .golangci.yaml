# golangci-lint v2 schema (requires golangci-lint >= 2.x, built with current Go toolchain).
# Copyright 2026 Code Capsules
# SPDX-License-Identifier: Apache-2.0
version: "2"

run:
  timeout: 15m
  tests: false

linters:
  default: standard
  disable:
    - cyclop
    - err113
    - errorlint
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocritic
    - godot
    - godox
    - gosec
    - mnd
    - nestif
    - nlreturn
    - noctx
    - nolintlint
    - predeclared
    - revive
    - sqlclosecheck
    - tagliatelle
    - whitespace
    - wrapcheck
    - wsl
    # Quickfix/suggestions from staticcheck are noisy for this codebase; re-enable when modernizing.
    - staticcheck
  settings:
    dupl:
      threshold: 400
    gocyclo:
      min-complexity: 10
    govet:
      enable:
        - shadow
      disable:
        # Go 1.26+ stdlib vs go 1.17 language version in go.mod produces false positives.
        - inline
    lll:
      line-length: 170
      tab-width: 4
  exclusions:
    generated: lax
    paths:
      - (^|/)vendor($|/)
      - (^|/)test/e2e($|/)
      - zz_generated.*\.go$

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: false

issues:
  max-same-issues: 0
