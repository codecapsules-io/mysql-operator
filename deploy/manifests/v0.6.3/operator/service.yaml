---
apiVersion: v1
kind: Service
metadata:
  name: mysql-operator
  labels:
    app.kubernetes.io/name: mysql-operator
    app.kubernetes.io/version: v0.6.3
    app.kubernetes.io/component: operator
spec:
  type: ClusterIP
  ports:
    - port: 80
      name: http
      protocol: TCP
      targetPort: http
    - port: 9125
      name: prometheus
      protocol: TCP
      targetPort: prometheus
  selector:
    app.kubernetes.io/name: mysql-operator
