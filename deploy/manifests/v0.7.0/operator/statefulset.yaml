apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-operator
  labels:
    app.kubernetes.io/name: mysql-operator
    app.kubernetes.io/version: v0.7.0
spec:
  replicas: 1
  serviceName: mysql-operator-orc
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-operator
    spec:
      serviceAccountName: mysql-operator
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: operator
          image: ghcr.io/codecapsules-io/mysql-operator:v0.7.0
          ports:
            - containerPort: 8080
              name: prometheus
              protocol: TCP
          env:
            - name: ORC_TOPOLOGY_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-operator-orc
                  key: TOPOLOGY_USER
            - name: ORC_TOPOLOGY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-operator-orc
                  key: TOPOLOGY_PASSWORD
          args:
            - --leader-election-namespace=mysql-operator
            - --orchestrator-uri=http://mysql-operator.mysql-operator/api
            - --image-pull-policy=Always
            - --sidecar-image=ghcr.io/codecapsules-io/mysql-operator-sidecar-5.7:v0.7.0
            - --sidecar-mysql8-image=ghcr.io/codecapsules-io/mysql-operator-sidecar-8.0:v0.7.0
            - --sidecar-mysql84-image=ghcr.io/codecapsules-io/mysql-operator-sidecar-8.4:v0.7.0
            - --metrics-exporter-image=docker.io/prom/mysqld-exporter:v0.16.0
            - --failover-before-shutdown=true
            # Set securityContext.allowPrivilegeEscalation=false on every init container and
            # container in managed MySQL cluster pods (opt-in; default is off).
            # - --cluster-restrict-privilege-escalation=true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
        - name: orchestrator
          image: ghcr.io/codecapsules-io/mysql-operator-orchestrator:v0.7.0
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
            - containerPort: 10008
              name: raft
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - prefix: ORC_
              secretRef:
                name: mysql-operator-orc
          volumeMounts:
            - name: data
              mountPath: /var/lib/orchestrator
            - name: config
              mountPath: /usr/local/share/orchestrator/templates
          livenessProbe:
            timeoutSeconds: 10
            initialDelaySeconds: 200
            httpGet:
              path: /api/lb-check
              port: 3000
          readinessProbe:
            timeoutSeconds: 10
            httpGet:
              path: /api/raft-health
              port: 3000
      volumes:
        - name: config
          configMap:
            name: mysql-operator-orc
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
